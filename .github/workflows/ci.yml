name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run: no point finishing stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres just for this job — same idea as the local test database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/meridian_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what the lockfile says and fails if it is out of date.
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Shared unit tests
        run: npm test -w @meridian/shared

      - name: API integration tests
        run: npm test -w @meridian/api

      - name: Web component tests
        run: npm test -w @meridian/web

      - name: Production build
        run: npm run build
